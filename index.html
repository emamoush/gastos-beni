<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos de Beni</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="pantalla-app">
    <div class="topbar">
      <div class="marca">
        <span class="punto"></span>
        <h1>Gastos de Beni</h1>
      </div>
    </div>

    <main>
      <!-- Saldo -->
      <div class="saldo-hero">
        <div class="etiqueta">Estado de cuentas</div>
        <div class="numero" id="saldo-numero">Cargando…</div>
        <div class="detalle" id="saldo-detalle"></div>
      </div>

      <!-- Totales -->
      <div class="totales">
        <div class="stat-card abigail">
          <div class="nombre">Abigail pagó</div>
          <div class="monto" id="total-abigail">$0</div>
          <div class="cant" id="cant-abigail">0 gastos</div>
        </div>
        <div class="stat-card bruno">
          <div class="nombre">Bruno pagó</div>
          <div class="monto" id="total-bruno">$0</div>
          <div class="cant" id="cant-bruno">0 gastos</div>
        </div>
      </div>

      <!-- Formulario -->
      <div class="panel">
        <h2>Cargar un gasto</h2>
        <form class="form-gasto" id="form-gasto">
          <div class="campo">
            <label for="g-fecha">Fecha</label>
            <input type="date" id="g-fecha" required>
          </div>
          <div class="campo">
            <label for="g-concepto">Concepto</label>
            <input type="text" id="g-concepto" placeholder="Ej: Zapatillas, colegio, pediatra" required>
          </div>
          <div class="campo">
            <label for="g-importe">Importe</label>
            <input type="number" id="g-importe" min="0.01" step="0.01" placeholder="0.00" required>
          </div>
          <div class="campo">
            <label>Pagó</label>
            <div class="pill-select" id="pill-pagador">
              <button type="button" data-valor="Abigail" class="abigail">Abigail</button>
              <button type="button" data-valor="Bruno" class="bruno">Bruno</button>
            </div>
          </div>
          <button type="submit" class="btn-agregar">Agregar</button>
        </form>
      </div>

      <!-- Listado / Historial -->
      <div class="lista-titulo">
        <h2>Historial</h2>
        <div class="filtro-tabs" id="filtro-tabs">
          <button data-filtro="todos" class="activo">Todos</button>
          <button data-filtro="Abigail">Abigail</button>
          <button data-filtro="Bruno">Bruno</button>
        </div>
      </div>
      <div class="tabla-gastos" id="tabla-gastos">
        <div class="vacio">Cargando gastos…</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
